# kayta tata yhdessa dallas-kuuntelija.yamlin kaa
substitutions:
  node_name: 2026-vilp-1
  friendly_name: "2026 Vilp 1"
  dallas_pin: "GPIO23"
  
packages:
  wifi: !include common/wifi.yaml
  otaapi: !include common/otaapi.yaml

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

one_wire:
  - platform: gpio
    pin: ${dallas_pin}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_IPV6: "y"
      CONFIG_LWIP_IPV6_AUTOCONFIG: "y"

# Aktivoidaan IPv6
network:
  enable_ipv6: true
  
# Aktivoidaan BLE ja BT
esp32_ble:
bluetooth_proxy:

# Aktivoidaan logger
logger:
  level: INFO

# Aktivoidaan debug moodi
debug:

# ==================================================
# Hupisensorit ESP32
# ==================================================

text_sensor:
  # IPv4
  - platform: template
    name: "IPv4"
    id: ipv4_address
    lambda: |-
      // etsitään ensimmäinen IPv4 osoite
      for (auto const& addr : network::get_ip_addresses()) {
        if (!addr.is_ip6()) return addr.str();
      }
      return std::string("0.0.0.0");

  # IPv6
  - platform: template
    name: "IPv6"
    id: ipv6_addresses
    icon: "mdi:ip-network"
    lambda: |-
      std::string addresses = "";
      for (auto const& addr : network::get_ip_addresses()) {
        if (addr.is_ip6()) {
          if (!addresses.empty()) addresses += ", ";
          addresses += addr.str();
        }
      }
      return addresses;

# ==================================================
# Dallas-anturit - RAW 64-bit HEX HA-event
# ==================================================

sensor:
  # ==================================================
  # Dallas-anturi 0
  - platform: dallas_temp
    index: 0
    id: temp_sensor_0
    update_interval: never
    internal: true
    on_value:
      then:
        - homeassistant.event:
            event: esphome.dallas_raw
            data:
              protocol_version: "0.1"
              address: !lambda 'return id(temp_sensor_0).get_address_name();'
              value: !lambda 'return x;'
              timestamp: !lambda |-
                char buf[32];
                time_t t = id(sntp_time).now().timestamp;
                struct tm ts;
                gmtime_r(&t, &ts);
                snprintf(buf, sizeof(buf), "%04d-%02d-%02dT%02d:%02d:%02dZ",
                         ts.tm_year + 1900, ts.tm_mon + 1, ts.tm_mday,
                         ts.tm_hour, ts.tm_min, ts.tm_sec);
                return std::string(buf);
              source_data: !lambda |-
                char buf[64];
                snprintf(buf, sizeof(buf), "id=%s,index=%d", id(temp_sensor_0).get_name().c_str(), 0);
                return std::string(buf);

