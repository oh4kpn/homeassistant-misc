# ==================================================
# Pollaus: päivitetään kaikki 30s välein
# ==================================================
time:
  - platform: sntp
    id: sntp_time
    timezone: "EET-2EEST,M3.5.0/3,M10.5.0/4"
    servers:
      - ntp-ext.prepay.fi
      - pool.ntp.prepay.fi
      - ntp.netnod.se
    on_time:
      - seconds: /30
        then:
          - component.update: temp_sensor_0
          - component.update: temp_sensor_1
          - component.update: temp_sensor_2
          - component.update: temp_sensor_3
          - component.update: temp_sensor_4
          - component.update: temp_sensor_5
